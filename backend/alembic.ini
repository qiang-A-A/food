# =============================================================================
# alembic.ini - Alembic migration tool configuration
# -----------------------------------------------------------------------------
# NOTE: keep this file ASCII-only (Windows configparser reads with locale
#       encoding GBK). The DB URL is overridden in alembic/env.py from
#       app.config settings, so the value below is only a fallback.
# =============================================================================

[alembic]
# Directory containing migration scripts (relative to backend working dir)
script_location = alembic

# Add backend dir to sys.path so `import app` works in env.py
prepend_sys_path = .

# DB URL placeholder - env.py overrides with settings.DATABASE_URL
sqlalchemy.url = sqlite:///./tsgq_dev.db

# Migration filename template
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
