# =============================================================================
# pyproject.toml — 天上宫阙后端工程定义与依赖声明
# -----------------------------------------------------------------------------
# 功能：定义 Python 后端项目的元数据、依赖清单与开发工具配置，
#       供 pip/pip-tools/uv 等工具安装与管理依赖（对应方案 §3.2 技术选型）。
# 说明：Python 3.11+；依赖版本按开发技术文档 v1.0 选型锁定主版本。
# =============================================================================

[project]
name = "tsgq-backend"
version = "0.1.0"
description = "天上宫阙 宫廷糕点企业官网 · FastAPI 后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ---- Web 框架：FastAPI + Uvicorn（异步服务器）----
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    # ---- ORM 与迁移：SQLAlchemy 2.x + Alembic（开发 SQLite / 生产 PostgreSQL）----
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    # ---- 数据校验：Pydantic v2 与配置管理 ----
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # ---- 认证：JWT 签发/校验 + bcrypt 密码哈希 ----
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    # ---- 文件上传：multipart 表单解析（FastAPI UploadFile 必需）----
    "python-multipart>=0.0.9,<1.0",
    # ---- 安全：富文本 HTML 白名单净化（防 XSS，对应方案 §7 规则 5）----
    "nh3>=0.2,<1.0",
    # ---- 校验扩展：EmailStr 等（联系方式邮箱校验备用）----
    "email-validator>=2.1,<3.0",
]

[project.optional-dependencies]
# 开发环境依赖：代码质量与测试工具
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",          # 配合 FastAPI TestClient 做接口测试
    "ruff>=0.4,<1.0",            # Python 代码风格检查
]

[tool.setuptools]
# 打包配置：将 app 包纳入安装
packages = ["app"]

[tool.ruff]
# Ruff 代码风格：行宽 120，Python 3.11 语法
line-length = 120
target-version = "py311"
