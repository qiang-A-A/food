# =============================================================================
# deploy/nginx.conf — 天上宫阙官网 生产 Nginx 配置
# -----------------------------------------------------------------------------
# 功能：单一域名下托管 前台(/)、后台(/admin)、API(/api)、上传文件(/uploads)。
#       前后台静态构建产物分别位于 frontend/dist 与 admin/dist（见构建脚本）。
# 用法：将本文件放入 /etc/nginx/conf.d/tsgq.conf（改 server_name 为实际域名），
#       nginx -t 校验后 nginx -s reload。
# =============================================================================

server {
    listen 80;
    # 生产域名（上线前替换，并完成 ICP 备案）
    server_name www.your-domain.com your-domain.com;

    # 前后台 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ---- 上传文件静态访问（后端本地存储）----
    location /uploads/ {
        alias /var/www/tsgq/uploads/;   # 与后端 UPLOAD_DIR 一致（或反代到后端）
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- API 反向代理（后端 8000）----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 上传接口允许大请求体（视频 ≤100MB）
        client_max_body_size 110m;
    }

    # ---- 后台管理（admin/dist 构建产物）----
    location /admin {
        alias /var/www/tsgq/admin-dist;   # 指向 admin/dist
        index index.html;
        try_files $uri $uri/ /admin/index.html;   # SPA 回退
    }

    # ---- 前台（frontend/dist 构建产物）----
    location / {
        root /var/www/tsgq/frontend-dist;  # 指向 frontend/dist
        index index.html;
        try_files $uri $uri/ /index.html;  # SPA 回退
    }

    # 静态资源缓存（带 hash 的构建产物）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        root /var/www/tsgq;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
